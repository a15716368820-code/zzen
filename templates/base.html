<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.site_title }} - {{ site.author_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/theme.css" rel="stylesheet">
</head>
<body class="theme-{{ site.theme }}">
  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">{{ site.site_title }}</a>
      <div class="d-flex gap-2">
        <a class="btn btn-sm btn-outline-secondary" href="/rss/">RSS</a>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-top py-3 text-center text-muted">
    © {{ site.author_name }}
  </footer>
</body>
</html>
